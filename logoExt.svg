<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pastelGreenBagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A2D9A4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6BCA70;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldSwooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/> <feOffset dx="2" dy="3" result="offsetblur"/> <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/> </feComponentTransfer>
      <feMerge> 
        <feMergeNode/> <feMergeNode in="SourceGraphic"/> </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="600" height="300" fill="#ffffff00"/>

  <g filter="url(#softShadow)" transform="translate(30, 20)">
      
      <g transform="translate(40, 75) rotate(-10)">
         <path d="M 15 0 Q 30 -25 45 0" stroke="url(#goldSwooshGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
         <rect x="0" y="0" width="60" height="50" rx="5" ry="5" fill="url(#pastelGreenBagGrad)"/>
        <circle cx="30" cy="25" r="10" fill="#ffffff" opacity="0.3"/>
      </g>

      <path d="M 60 135 Q 250 180 480 125 L 490 140 Q 250 200 50 155 Z" fill="url(#goldSwooshGrad)"/>

      <text x="300" y="135" 
            font-family="'Arial', 'Helvetica', sans-serif" 
            font-weight="900" 
            font-style="italic" 
            font-size="85" 
            fill="url(#pastelGreenBagGrad)" 
            stroke="#ffffff" 
            stroke-width="2.5"
            text-anchor="middle"
            letter-spacing="-2">
        superSpan
      </text>

     
  </g>
</svg>